<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login Admin - Buku Mimpi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui;
            background: linear-gradient(145deg, #1e2a3a 0%, #0f1724 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            background: rgba(255,248,235,0.95);
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
        }
        .header {
            background: #2c1e12;
            padding: 1.5rem;
            text-align: center;
            border-bottom: 3px solid #e6b450;
        }
        .header h1 { font-size: 1.6rem; color: #fae67a; }
        .header p { color: #ecd9b4; font-size: 0.8rem; margin-top: 0.3rem; }
        .form-panel {
            padding: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #5a3e28;
            margin-bottom: 0.3rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem;
            border-radius: 1rem;
            border: 1px solid #e2caa4;
            background: #fffdf9;
            font-family: inherit;
        }
        button {
            width: 100%;
            background: #8b6946;
            color: white;
            border: none;
            padding: 0.7rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        button:hover { background: #a57c52; }
        .message {
            margin-top: 1rem;
            padding: 0.5rem;
            border-radius: 1rem;
            text-align: center;
            font-size: 0.8rem;
        }
        .error { background: #ffe0e0; color: #aa2e2e; }
        .success { background: #e0ffe0; color: #2e6a2e; }
        .footer {
            background: #f7efdf;
            text-align: center;
            padding: 0.8rem;
            color: #7a5a3a;
            font-size: 0.7rem;
            border-top: 1px solid #e2caa4;
        }
        .info {
            background: #fff0d0;
            padding: 0.8rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: #7a5a3a;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="header">
        <h1>👑 BUKU MIMPI</h1>
        <p>Panel Admin - Log Masuk</p>
    </div>
    
    <div class="form-panel">
        <div class="info">
            🔐 Akaun Tetap Sahaja<br>
            <strong>Username: admin</strong><br>
            <strong>Password: 68900</strong>
        </div>
        <div class="form-group">
            <label>👤 Nama Pengguna</label>
            <input type="text" id="loginUsername" placeholder="admin">
        </div>
        <div class="form-group">
            <label>🔒 Kata Laluan</label>
            <input type="password" id="loginPassword" placeholder="********">
        </div>
        <button id="doLoginBtn">Log Masuk</button>
        <div id="loginMessage" class="message"></div>
    </div>
    
    <div class="footer">
        🔐 Hanya admin tetap yang dibenarkan
    </div>
</div>

<script>
    // =========== AKAUN TETAP ===========
    const FIXED_USERNAME = "admin";
    const FIXED_PASSWORD = "68900";
    const SESSION_KEY = "buku_mimpi_session";
    
    // Semak session
    function checkSession() {
        const session = localStorage.getItem(SESSION_KEY);
        if (session === "logged_in") {
            window.location.href = "admin.html";
        }
    }
    
    // Fungsi bantu
    function showMessage(element, msg, isError = true) {
        element.textContent = msg;
        element.className = `message ${isError ? 'error' : 'success'}`;
        setTimeout(() => {
            element.textContent = '';
            element.className = 'message';
        }, 3000);
    }
    
    // =========== LOGIN ===========
    document.getElementById('doLoginBtn').addEventListener('click', () => {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        
        if (!username || !password) {
            showMessage(document.getElementById('loginMessage'), 'Sila isi nama pengguna dan kata laluan');
            return;
        }
        
        if (username === FIXED_USERNAME && password === FIXED_PASSWORD) {
            localStorage.setItem(SESSION_KEY, "logged_in");
            localStorage.setItem("buku_mimpi_current_user", username);
            showMessage(document.getElementById('loginMessage'), 'Login berjaya! Mengalihkan...', false);
            setTimeout(() => {
                window.location.href = "admin.html";
            }, 1000);
        } else {
            showMessage(document.getElementById('loginMessage'), 'Nama pengguna atau kata laluan salah');
        }
    });
    
    // Semak jika sudah login
    checkSession();
</script>
</body>
</html>
