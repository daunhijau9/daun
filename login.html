<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login - Buku Mimpi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui;
            background: linear-gradient(145deg, #1e2a3a 0%, #0f1724 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            background: rgba(255,248,235,0.95);
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
        }
        .header {
            background: #2c1e12;
            padding: 1.5rem;
            text-align: center;
            border-bottom: 3px solid #e6b450;
        }
        .header h1 { font-size: 1.6rem; color: #fae67a; }
        .header p { color: #ecd9b4; font-size: 0.8rem; margin-top: 0.3rem; }
        .tabs {
            display: flex;
            background: #3e2a1f;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 0.8rem;
            background: #5e422b;
            color: #ffefcf;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        .tab.active {
            background: #ffefcf;
            color: #3e2a1f;
        }
        .form-panel {
            padding: 1.5rem;
            display: none;
        }
        .form-panel.active {
            display: block;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #5a3e28;
            margin-bottom: 0.3rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem;
            border-radius: 1rem;
            border: 1px solid #e2caa4;
            background: #fffdf9;
            font-family: inherit;
        }
        button {
            width: 100%;
            background: #8b6946;
            color: white;
            border: none;
            padding: 0.7rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        button:hover { background: #a57c52; }
        .message {
            margin-top: 1rem;
            padding: 0.5rem;
            border-radius: 1rem;
            text-align: center;
            font-size: 0.8rem;
        }
        .error { background: #ffe0e0; color: #aa2e2e; }
        .success { background: #e0ffe0; color: #2e6a2e; }
        .footer {
            background: #f7efdf;
            text-align: center;
            padding: 0.8rem;
            color: #7a5a3a;
            font-size: 0.7rem;
            border-top: 1px solid #e2caa4;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="header">
        <h1>📖 BUKU MIMPI</h1>
        <p>Sila Log Masuk atau Daftar Akaun</p>
    </div>
    <div class="tabs">
        <button class="tab active" id="loginTab">Log Masuk</button>
        <button class="tab" id="registerTab">Daftar Akaun</button>
    </div>
    
    <!-- Panel Login -->
    <div class="form-panel active" id="loginPanel">
        <div class="form-group">
            <label>👤 Nama Pengguna</label>
            <input type="text" id="loginUsername" placeholder="Nama pengguna anda">
        </div>
        <div class="form-group">
            <label>🔒 Kata Laluan</label>
            <input type="password" id="loginPassword" placeholder="********">
        </div>
        <button id="doLoginBtn">Log Masuk</button>
        <div id="loginMessage" class="message"></div>
    </div>
    
    <!-- Panel Daftar -->
    <div class="form-panel" id="registerPanel">
        <div class="form-group">
            <label>👤 Nama Pengguna</label>
            <input type="text" id="regUsername" placeholder="Pilih nama pengguna">
        </div>
        <div class="form-group">
            <label>🔒 Kata Laluan (min 4 huruf)</label>
            <input type="password" id="regPassword" placeholder="****">
        </div>
        <button id="doRegisterBtn">Daftar Akaun</button>
        <div id="registerMessage" class="message"></div>
    </div>
    <div class="footer">
        🔐 Daftar akaun untuk melihat koleksi mimpi
    </div>
</div>

<script>
    // =========== STORAGE KEYS ===========
    const USERS_KEY = "buku_mimpi_users";
    const SESSION_KEY = "buku_mimpi_session";
    
    // Akaun admin tetap (tidak kelihatan di UI)
    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "68900";
    
    // Data pengguna lalai (hanya admin)
    const defaultUsers = [
        { username: ADMIN_USERNAME, password: ADMIN_PASSWORD }
    ];
    
    // Muat senarai pengguna
    function loadUsers() {
        const stored = localStorage.getItem(USERS_KEY);
        if (stored) {
            return JSON.parse(stored);
        } else {
            localStorage.setItem(USERS_KEY, JSON.stringify(defaultUsers));
            return defaultUsers;
        }
    }
    
    // Simpan senarai pengguna
    function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }
    
    // Semak session
    function checkSession() {
        const session = localStorage.getItem(SESSION_KEY);
        if (session === "logged_in") {
            window.location.href = "dashboard.html";
        }
    }
    
    // Fungsi bantu
    function showMessage(element, msg, isError = true) {
        element.textContent = msg;
        element.className = `message ${isError ? 'error' : 'success'}`;
        setTimeout(() => {
            element.textContent = '';
            element.className = 'message';
        }, 3000);
    }
    
    // =========== LOGIN ===========
    document.getElementById('doLoginBtn').addEventListener('click', () => {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        
        if (!username || !password) {
            showMessage(document.getElementById('loginMessage'), 'Sila isi nama pengguna dan kata laluan');
            return;
        }
        
        const users = loadUsers();
        const user = users.find(u => u.username === username && u.password === password);
        
        if (user) {
            localStorage.setItem(SESSION_KEY, "logged_in");
            localStorage.setItem("buku_mimpi_current_user", username);
            showMessage(document.getElementById('loginMessage'), 'Login berjaya! Mengalihkan...', false);
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1000);
        } else {
            showMessage(document.getElementById('loginMessage'), 'Nama pengguna atau kata laluan salah');
        }
    });
    
    // =========== REGISTER ===========
    document.getElementById('doRegisterBtn').addEventListener('click', () => {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        
        if (!username || !password) {
            showMessage(document.getElementById('registerMessage'), 'Sila isi nama pengguna dan kata laluan');
            return;
        }
        if (password.length < 4) {
            showMessage(document.getElementById('registerMessage'), 'Kata laluan minimum 4 huruf');
            return;
        }
        if (username === ADMIN_USERNAME) {
            showMessage(document.getElementById('registerMessage'), 'Nama pengguna ini tidak tersedia');
            return;
        }
        
        const users = loadUsers();
        
        // Semak jika username sudah wujud
        if (users.find(u => u.username === username)) {
            showMessage(document.getElementById('registerMessage'), 'Nama pengguna sudah wujud!');
            return;
        }
        
        // Tambah pengguna baru
        users.push({ username, password });
        saveUsers(users);
        
        showMessage(document.getElementById('registerMessage'), 'Pendaftaran berjaya! Sila login.', false);
        document.getElementById('regUsername').value = '';
        document.getElementById('regPassword').value = '';
        
        // Tukar ke tab login selepas 1.5 saat
        setTimeout(() => {
            document.getElementById('loginTab').click();
        }, 1500);
    });
    
    // =========== TUKAR TAB ===========
    document.getElementById('loginTab').addEventListener('click', () => {
        document.getElementById('loginTab').classList.add('active');
        document.getElementById('registerTab').classList.remove('active');
        document.getElementById('loginPanel').classList.add('active');
        document.getElementById('registerPanel').classList.remove('active');
    });
    document.getElementById('registerTab').addEventListener('click', () => {
        document.getElementById('registerTab').classList.add('active');
        document.getElementById('loginTab').classList.remove('active');
        document.getElementById('registerPanel').classList.add('active');
        document.getElementById('loginPanel').classList.remove('active');
    });
    
    // Semak jika sudah login
    checkSession();
</script>
</body>
</html>
