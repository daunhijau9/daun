<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Buku Mimpi - Panel Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-panel {
            background: #f7efdf;
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .admin-panel h3 {
            color: #4b2e1a;
            margin-bottom: 1rem;
        }
        .form-group {
            margin-bottom: 0.8rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #5a3e28;
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.6rem;
            border-radius: 1rem;
            border: 1px solid #e2caa4;
            background: #fffdf9;
            font-family: inherit;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .dream-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fffaf2;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            margin-bottom: 0.5rem;
            border: 1px solid #f3dfbc;
        }
        .dream-actions {
            display: flex;
            gap: 8px;
        }
        .dream-actions button {
            padding: 0.3rem 0.8rem;
            border-radius: 1.5rem;
            border: none;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .edit-btn { background: #f5b042; color: #2c1e12; }
        .delete-btn { background: #aa6f5e; color: white; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fffaf2;
            max-width: 600px;
            width: 90%;
            border-radius: 1.5rem;
            padding: 1.5rem;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>📖 BUKU MIMPI</h2>
            <p>Karangan mimpi-mimpi</p>
        </div>
        <div class="sidebar-menu">
            <a href="index.html" class="menu-item">
                <i>🏠</i> <span>Home</span>
            </a>
            <div class="menu-item active">
                <i>👑</i> <span>Panel Admin</span>
            </div>
            <div class="menu-item" id="logoutLink">
                <i>🚪</i> <span>Logout</span>
            </div>
        </div>
        <div class="sidebar-footer">
            <p>✦ Admin Panel ✦</p>
        </div>
    </div>

    <div class="main-content">
        <!-- Panel Admin -->
        <div class="admin-panel">
            <h3>✍️ Tambah Mimpi Baru</h3>
            <div class="form-group">
                <label>🌟 Tajuk Mimpi</label>
                <input type="text" id="newTitle" placeholder="Contoh: Terbang ke Bulan">
            </div>
            <div class="form-group">
                <label>📝 Cerita Mimpi</label>
                <textarea id="newDesc" rows="4" placeholder="Tuliskan detail mimpimu..."></textarea>
            </div>
            <div class="form-group">
                <label>🏷️ Label pendek (opsional)</label>
                <input type="text" id="newShort" placeholder="Misal: 'Terbang'" maxlength="14">
            </div>
            <div class="button-group">
                <button class="btn" id="postDreamBtn">📌 Post Mimpi</button>
                <button class="btn btn-bulk" id="bulkImportBtn">📦 Import Pukal (JSON)</button>
            </div>
        </div>

        <!-- Senarai Semua Mimpi -->
        <div class="dream-list-section">
            <h3>📜 Senarai Semua Mimpi (Klik untuk edit)</h3>
            <div class="dream-list" id="dreamList">
                <div class="empty-message">Loading mimpi...</div>
            </div>
        </div>
        
        <div class="footer">
            🎙️ Suara AI lelaki | Panel Admin
        </div>
    </div>

    <!-- Modal Edit -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>✏️ Edit Mimpi</h3>
            <div class="form-group">
                <label>Tajuk</label>
                <input type="text" id="editTitle">
            </div>
            <div class="form-group">
                <label>Label pendek</label>
                <input type="text" id="editShort">
            </div>
            <div class="form-group">
                <label>Cerita</label>
                <textarea id="editDesc" rows="5"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn" id="cancelEditBtn">Batal</button>
                <button class="btn" id="saveEditBtn">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Modal Bulk Import -->
    <div id="bulkModal" class="modal">
        <div class="modal-content">
            <h3>📦 Import Pukal Mimpi (JSON)</h3>
            <textarea id="bulkJson" rows="8" placeholder='[{"title":"Mimpi 1","shortLabel":"M1","description":"Cerita..."}]'></textarea>
            <div class="modal-buttons">
                <button class="btn" id="cancelBulkBtn">Batal</button>
                <button class="btn" id="confirmBulkBtn">Import</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let dreamsData = [];
        let editingId = null;
        
        function loadData() {
            dreamsData = loadDreams();
            renderDreamList();
        }
        
        function renderDreamList() {
            const dreamListDiv = document.getElementById('dreamList');
            if (dreamsData.length === 0) {
                dreamListDiv.innerHTML = '<div class="empty-message">✨ Belum ada mimpi. Tambah mimpi pertama!</div>';
                return;
            }
            
            dreamListDiv.innerHTML = '';
            dreamsData.forEach((dream, idx) => {
                const item = document.createElement('div');
                item.className = 'dream-list-item';
                item.innerHTML = `
                    <div class="dream-list-title">${escapeHtml(dream.title)}</div>
                    <div class="dream-actions">
                        <button class="edit-btn" data-id="${dream.id}">✏️ Edit</button>
                        <button class="delete-btn" data-id="${dream.id}">🗑️ Hapus</button>
                    </div>
                `;
                dreamListDiv.appendChild(item);
            });
            
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.onclick = () => openEdit(btn.getAttribute('data-id'));
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = () => {
                    if (confirm("Padam mimpi ini?")) {
                        deleteDream(btn.getAttribute('data-id'));
                        loadData();
                    }
                };
            });
        }
        
        function openEdit(id) {
            const dream = dreamsData.find(d => d.id === id);
            if (!dream) return;
            editingId = id;
            document.getElementById('editTitle').value = dream.title;
            document.getElementById('editShort').value = dream.shortLabel || '';
            document.getElementById('editDesc').value = dream.description;
            document.getElementById('editModal').style.display = 'flex';
        }
        
        function saveEdit() {
            if (!editingId) return;
            const newTitle = document.getElementById('editTitle').value.trim();
            const newShort = document.getElementById('editShort').value.trim();
            const newDesc = document.getElementById('editDesc').value.trim();
            if (!newTitle || !newDesc) { alert("Tajuk dan cerita wajib!"); return; }
            updateDream(editingId, newTitle, newShort || newTitle.substring(0,12), newDesc);
            loadData();
            document.getElementById('editModal').style.display = 'none';
            editingId = null;
        }
        
        function postDream() {
            const title = document.getElementById('newTitle').value;
            const desc = document.getElementById('newDesc').value;
            const short = document.getElementById('newShort').value;
            if (!title.trim() || !desc.trim()) { alert("Tajuk dan cerita wajib!"); return; }
            addDream(title, desc, short);
            document.getElementById('newTitle').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newShort').value = '';
            loadData();
            alert("Mimpi ditambah!");
        }
        
        function openBulkModal() {
            document.getElementById('bulkModal').style.display = 'flex';
        }
        
        function closeBulkModal() {
            document.getElementById('bulkModal').style.display = 'none';
        }
        
        function confirmBulkImport() {
            const jsonText = document.getElementById('bulkJson').value.trim();
            if (!jsonText) { alert("Masukkan JSON"); return; }
            try {
                const parsed = JSON.parse(jsonText);
                let added = 0;
                for (let item of parsed) {
                    if (item.title && item.description) {
                        addDream(item.title, item.description, item.shortLabel || '');
                        added++;
                    }
                }
                document.getElementById('bulkJson').value = '';
                closeBulkModal();
                loadData();
                alert(`Berjaya import ${added} mimpi.`);
            } catch(e) { alert("JSON tidak sah: " + e.message); }
        }
        
        // Check if logged in as admin
        if (localStorage.getItem(SESSION_KEY) !== "logged_in" || localStorage.getItem("buku_mimpi_current_user") !== "admin") {
            window.location.href = "login.html";
        }
        
        document.getElementById('postDreamBtn').onclick = postDream;
        document.getElementById('bulkImportBtn').onclick = openBulkModal;
        document.getElementById('cancelBulkBtn').onclick = closeBulkModal;
        document.getElementById('confirmBulkBtn').onclick = confirmBulkImport;
        document.getElementById('cancelEditBtn').onclick = () => document.getElementById('editModal').style.display = 'none';
        document.getElementById('saveEditBtn').onclick = saveEdit;
        document.getElementById('logoutLink').onclick = () => logout();
        
        window.onclick = (e) => {
            if (e.target === document.getElementById('editModal')) document.getElementById('editModal').style.display = 'none';
            if (e.target === document.getElementById('bulkModal')) closeBulkModal();
        };
        
        loadData();
    </script>
</body>
</html>
