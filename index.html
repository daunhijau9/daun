<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Buku Mimpi - Satu Mimpi Setiap Hari</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui;
            background: linear-gradient(145deg, #1e2a3a 0%, #0f1724 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .dream-container {
            max-width: 700px;
            width: 100%;
            background: rgba(255,248,235,0.95);
            border-radius: 2rem;
            overflow: hidden;
            margin: 1rem;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
            text-align: center;
        }
        .header {
            background: #2c1e12;
            padding: 1rem;
            border-bottom: 3px solid #e6b450;
        }
        .header h1 {
            font-size: 1.6rem;
            color: #fae67a;
            text-shadow: 2px 2px 0 #5a3e1f;
        }
        .header p {
            color: #ecd9b4;
            font-style: italic;
            font-size: 0.8rem;
        }
        .dream-card {
            background: #fffaf2;
            padding: 1.8rem;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .dream-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #4b2e1a;
            border-left: 5px solid #f5b042;
            padding-left: 1rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .dream-description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #2e241a;
            background: #fff6ea;
            padding: 1rem;
            border-radius: 1rem;
            white-space: pre-wrap;
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .counter {
            font-size: 0.8rem;
            color: #7a5a3a;
            margin-bottom: 1rem;
        }
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            background: #8b6946;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn:hover { background: #a57c52; transform: scale(1.02); }
        .voice-btn {
            background: linear-gradient(95deg, #2c5f7a, #1e3e58);
        }
        .voice-btn:hover { background: linear-gradient(95deg, #1f4a64, #123247); }
        .admin-link {
            background: #aa6f5e;
            text-decoration: none;
            display: inline-block;
        }
        .admin-link:hover { background: #8b5342; }
        .speech-status {
            font-size: 0.7rem;
            color: #7e6b53;
            margin-top: 1rem;
        }
        .footer {
            background: #2c1e12;
            text-align: center;
            padding: 0.7rem;
            color: #cbae86;
            font-size: 0.7rem;
        }
        @media (max-width: 550px) {
            .dream-title { font-size: 1.3rem; }
            .dream-description { font-size: 0.9rem; }
            .btn { padding: 0.5rem 1rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="dream-container">
    <div class="header">
        <h1>📖 BUKU MIMPI</h1>
        <p>✦ Satu mimpi setiap kali anda datang ✦</p>
    </div>
    
    <div class="dream-card" id="dreamCard">
        <div class="counter" id="counter">Memuatkan...</div>
        <div class="dream-title" id="dreamTitle">-</div>
        <div class="dream-description" id="dreamDescription">-</div>
        <div class="button-group">
            <button class="btn" id="randomBtn">🎲 Mimpi Lain</button>
            <button class="btn voice-btn" id="voiceBtn">🎙️ Dengar</button>
            <a href="login.html" class="btn admin-link">🔑 Admin</a>
        </div>
        <div class="speech-status" id="speechStatus">✨ AI siap membaca</div>
    </div>
    
    <div class="footer">
        🎙️ Suara AI lelaki | Koleksi ratusan mimpi
    </div>
</div>

<script>
    const DREAMS_KEY = "buku_mimpi_data";
    
    let dreamsData = [];
    let currentDream = null;
    let preferredVoice = null;
    let voicesLoaded = false;
    
    // Muat mimpi dari localStorage
    function loadDreams() {
        const stored = localStorage.getItem(DREAMS_KEY);
        if (stored) {
            dreamsData = JSON.parse(stored);
        } else {
            dreamsData = [];
        }
        
        if (dreamsData.length === 0) {
            document.getElementById('dreamTitle').innerHTML = "✨ Belum Ada Mimpi ✨";
            document.getElementById('dreamDescription').innerHTML = "Sila tunggu admin menambah mimpi.";
            document.getElementById('counter').innerHTML = "0 mimpi dalam koleksi";
            document.getElementById('voiceBtn').style.display = 'none';
        } else {
            document.getElementById('voiceBtn').style.display = 'inline-flex';
            showRandomDream();
        }
    }
    
    // Papar mimpi rawak
    function showRandomDream() {
        if (dreamsData.length === 0) return;
        
        const randomIndex = Math.floor(Math.random() * dreamsData.length);
        currentDream = dreamsData[randomIndex];
        
        document.getElementById('dreamTitle').innerHTML = escapeHtml(currentDream.title);
        document.getElementById('dreamDescription').innerHTML = escapeHtml(currentDream.description);
        document.getElementById('counter').innerHTML = `📖 Mimpi #${randomIndex + 1} daripada ${dreamsData.length} mimpi`;
        document.getElementById('speechStatus').innerHTML = "✨ AI siap membaca";
        
        // Hentikan bacaan jika sedang berbunyi
        if (window.speechSynthesis) window.speechSynthesis.cancel();
    }
    
    // Suara AI
    function initVoice() {
        const voices = window.speechSynthesis.getVoices();
        if (!voices.length) return;
        let male = voices.find(v => v.name.toLowerCase().includes('male') || (v.lang === 'en-US' && v.name.toLowerCase().includes('male')));
        if (!male) male = voices.find(v => !v.name.toLowerCase().includes('female'));
        preferredVoice = male || voices[0];
        voicesLoaded = true;
    }
    
    function speak(text) {
        if (!window.speechSynthesis) return;
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'id-ID';
        utter.rate = 0.9;
        if (preferredVoice) utter.voice = preferredVoice;
        else if (!voicesLoaded) {
            window.speechSynthesis.onvoiceschanged = () => { initVoice(); if(preferredVoice) utter.voice = preferredVoice; window.speechSynthesis.speak(utter); };
            return;
        }
        utter.onstart = () => document.getElementById('speechStatus').innerHTML = "🔊 AI membaca...";
        utter.onend = () => document.getElementById('speechStatus').innerHTML = "✅ Selesai membaca";
        utter.onerror = () => document.getElementById('speechStatus').innerHTML = "⚠️ Gagal membaca";
        window.speechSynthesis.speak(utter);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    // Event listeners
    document.getElementById('randomBtn').addEventListener('click', () => {
        showRandomDream();
    });
    
    document.getElementById('voiceBtn').addEventListener('click', () => {
        if (currentDream && currentDream.description) {
            speak(currentDream.description);
        }
    });
    
    // Init
    window.addEventListener('load', () => {
        loadDreams();
        if (window.speechSynthesis) {
            if (window.speechSynthesis.getVoices().length) initVoice();
            else window.speechSynthesis.onvoiceschanged = initVoice;
        }
    });
</script>
</body>
</html>
