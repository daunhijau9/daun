<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Buku Mimpi - Selamat Datang</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui;
            background: linear-gradient(145deg, #1e2a3a 0%, #0f1724 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255,248,235,0.95);
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: #2c1e12;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #5a3e28;
            margin-bottom: 2rem;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        a {
            display: block;
            background: #8b6946;
            color: white;
            text-decoration: none;
            padding: 0.8rem;
            border-radius: 2rem;
            font-weight: bold;
            transition: 0.2s;
        }
        a:hover {
            background: #a57c52;
            transform: scale(1.02);
        }
        .admin-link {
            background: #2c5f7a;
        }
        .admin-link:hover {
            background: #1f4a64;
        }
        footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #7a5a3a;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📖 BUKU MIMPI</h1>
    <p>✦ Karangan mimpi-mimpi ✦</p>
    <div class="button-group">
        <a href="reader.html">📚 Baca Mimpi (Pembaca)</a>
        <a href="admin.html" class="admin-link">👑 Urus Mimpi (Admin)</a>
    </div>
    <footer>🎙️ Suara AI lelaki | Disimpan di awan</footer>
</div>
</body>
</html>
