<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Buku Mimpi - Pembaca</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui;
            background: linear-gradient(145deg, #1e2a3a 0%, #0f1724 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }
        .dream-book {
            max-width: 1000px;
            width: 100%;
            background: rgba(255,248,235,0.95);
            border-radius: 2rem;
            overflow: hidden;
            margin: 1rem;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
        }
        .header {
            background: #2c1e12;
            padding: 1rem;
            text-align: center;
            border-bottom: 3px solid #e6b450;
        }
        .header h1 { font-size: 1.6rem; color: #fae67a; text-shadow: 2px 2px 0 #5a3e1f; }
        .header p { color: #ecd9b4; font-style: italic; font-size: 0.8rem; }
        .tab-nav {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            background: #3e2a1f;
            gap: 0.25rem;
            padding: 0.6rem 0.6rem 0 0.6rem;
            scrollbar-width: thin;
        }
        .tab-nav::-webkit-scrollbar { height: 4px; }
        .tab-nav::-webkit-scrollbar-track { background: #5e422b; border-radius: 10px; }
        .tab-nav::-webkit-scrollbar-thumb { background: #f5b042; border-radius: 10px; }
        .tab-btn {
            background: #5e422b;
            border: none;
            padding: 0.5rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #ffefcf;
            cursor: pointer;
            border-radius: 1rem 1rem 0 0;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tab-btn:hover { background: #7b5a3c; }
        .tab-btn.active { background: #ffefcf; color: #3e2a1f; border-bottom: 2px solid #ffb347; }
        .tab-content-container {
            background: #ffefcf;
            padding: 1rem;
            min-height: 300px;
        }
        .tab-pane { display: none; animation: fadeSlide 0.25s ease-out; }
        .tab-pane.active-pane { display: block; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .dream-card {
            background: #fffaf2;
            border-radius: 1.5rem;
            padding: 1rem;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
            border: 1px solid #f3dfbc;
        }
        .dream-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #4b2e1a;
            border-left: 5px solid #f5b042;
            padding-left: 0.7rem;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .dream-title span {
            background: #f0dbc0;
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 30px;
        }
        .dream-description {
            font-size: 0.95rem;
            line-height: 1.5;
            background: #fff6ea;
            padding: 0.8rem;
            border-radius: 1rem;
            white-space: pre-wrap;
            margin-bottom: 1rem;
        }
        .voice-btn {
            background: linear-gradient(95deg, #2c5f7a, #1e3e58);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .voice-btn:hover { background: linear-gradient(95deg, #1f4a64, #123247); transform: scale(1.02); }
        .speech-status {
            font-size: 0.65rem;
            color: #7e6b53;
            margin-left: 0.5rem;
        }
        .footer {
            background: #2c1e12;
            text-align: center;
            padding: 0.7rem;
            color: #cbae86;
            font-size: 0.7rem;
        }
        .empty-message {
            text-align: center;
            padding: 2rem;
            background: #fff6ea;
            border-radius: 1.2rem;
            color: #7a5a3a;
        }
        @media (max-width: 550px) {
            .dream-book { margin: 0.5rem; border-radius: 1.5rem; }
            .header h1 { font-size: 1.3rem; }
            .dream-title { font-size: 1.1rem; }
            .voice-btn { padding: 0.4rem 0.8rem; font-size: 0.7rem; }
            .tab-btn { padding: 0.4rem 0.7rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="dream-book">
    <div class="header">
        <h1>📖 BUKU MIMPI</h1>
        <p>✦ Karangan mimpi-mimpi ✦ Setiap tab adalah dunia tersendiri ✦</p>
    </div>
    <div class="tab-nav" id="tabNav"></div>
    <div class="tab-content-container" id="tabContent">
        <div class="empty-message">Memuatkan mimpi...</div>
    </div>
    <div class="footer">
        🎙️ Suara AI lelaki | Koleksi mimpi dikongsi ramai
    </div>
</div>

<script>
    const SUPABASE_URL = "https://ofatbleambihhqbboalh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mYXRibGVhbWJpaGhxYmJvYWxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MzgxMzQsImV4cCI6MjA5NjMxNDEzNH0.FOGqpRUa9Ch0Z7Ilk-yoCkKxs1zrKix_2DxdnTz6OXA";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let dreamsData = [];
    let currentActiveId = null;
    let preferredVoice = null;
    let voicesLoaded = false;

    function initVoice() {
        const voices = window.speechSynthesis.getVoices();
        if (!voices.length) return;
        let male = voices.find(v => v.name.toLowerCase().includes('male') || (v.lang === 'en-US' && v.name.toLowerCase().includes('male')));
        if (!male) male = voices.find(v => !v.name.toLowerCase().includes('female'));
        preferredVoice = male || voices[0];
        voicesLoaded = true;
    }

    function speak(text, id) {
        if (!window.speechSynthesis) return;
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'id-ID';
        utter.rate = 0.9;
        if (preferredVoice) utter.voice = preferredVoice;
        else if (!voicesLoaded) {
            window.speechSynthesis.onvoiceschanged = () => { initVoice(); if(preferredVoice) utter.voice = preferredVoice; window.speechSynthesis.speak(utter); };
            return;
        }
        utter.onstart = () => { let s = document.getElementById(`speech-${id}`); if(s) s.innerText = "🔊 Membaca..."; };
        utter.onend = () => { let s = document.getElementById(`speech-${id}`); if(s) { s.innerText = "✅ Selesai"; setTimeout(() => { if(s.innerText === "✅ Selesai") s.innerText = "✨ AI siap"; }, 2000); } };
        window.speechSynthesis.speak(utter);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    async function loadDreams() {
        const { data, error } = await supabase
            .from('dreams')
            .select('*')
            .order('created_at', { ascending: true });
        
        if (error) {
            console.error("Error:", error);
            dreamsData = [];
        } else {
            dreamsData = data || [];
        }
        render();
        if (dreamsData.length > 0 && !currentActiveId) activateTab(dreamsData[0].id);
    }

    function render() {
        const tabNav = document.getElementById('tabNav');
        const tabContent = document.getElementById('tabContent');
        if (!tabNav || !tabContent) return;

        const active = document.querySelector('.tab-pane.active-pane');
        if (active) currentActiveId = active.getAttribute('data-pane');
        else if (dreamsData.length > 0 && !currentActiveId) currentActiveId = dreamsData[0].id;

        tabNav.innerHTML = '';
        tabContent.innerHTML = '';

        if (dreamsData.length === 0) {
            tabContent.innerHTML = '<div class="empty-message">✨ Belum ada mimpi. Sila tunggu admin menambah mimpi. ✨</div>';
            return;
        }

        dreamsData.forEach((dream, idx) => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            if (currentActiveId === dream.id) btn.classList.add('active');
            btn.setAttribute('data-tab', dream.id);
            const label = (dream.short_label && dream.short_label.trim()) ? dream.short_label : dream.title.substring(0, 12);
            btn.innerHTML = `<span>${escapeHtml(label)}</span>`;
            btn.onclick = () => activateTab(dream.id);
            tabNav.appendChild(btn);

            const pane = document.createElement('div');
            pane.className = 'tab-pane';
            if (currentActiveId === dream.id) pane.classList.add('active-pane');
            pane.setAttribute('data-pane', dream.id);
            pane.innerHTML = `
                <div class="dream-card">
                    <div class="dream-title">
                        ${escapeHtml(dream.title)}
                        <span>📖 mimpi #${idx+1}</span>
                    </div>
                    <div class="dream-description">${escapeHtml(dream.description)}</div>
                    <div>
                        <button class="voice-btn" data-id="${dream.id}">🎙️ Baca dengan AI</button>
                        <span class="speech-status" id="speech-${dream.id}">✨ AI siap</span>
                    </div>
                </div>
            `;
            tabContent.appendChild(pane);
        });

        document.querySelectorAll('.voice-btn').forEach(btn => {
            btn.onclick = () => { const d = dreamsData.find(x => x.id === btn.getAttribute('data-id')); if(d) speak(d.description, d.id); };
        });
    }

    function activateTab(id) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.getAttribute('data-tab') === id) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        document.querySelectorAll('.tab-pane').forEach(pane => {
            if (pane.getAttribute('data-pane') === id) pane.classList.add('active-pane');
            else pane.classList.remove('active-pane');
        });
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        currentActiveId = id;
    }

    window.addEventListener('load', () => {
        loadDreams();
        if (window.speechSynthesis) {
            if (window.speechSynthesis.getVoices().length) initVoice();
            else window.speechSynthesis.onvoiceschanged = initVoice;
        }
    });
</script>
</body>
</html>
