<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Buku Mimpi - Karangan Mimpi-mimpi</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui;
            background: linear-gradient(145deg, #1e2a3a 0%, #0f1724 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
        }
        .dream-book {
            max-width: 1000px;
            width: 100%;
            background: rgba(255,248,235,0.95);
            border-radius: 2rem;
            overflow: hidden;
            margin: 1rem;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .global-header {
            background: #2c1e12;
            padding: 1rem;
            text-align: center;
            border-bottom: 3px solid #e6b450;
            position: relative;
        }
        .global-header h1 {
            font-size: 1.6rem;
            color: #fae67a;
            text-shadow: 2px 2px 0 #5a3e1f;
        }
        .global-header p {
            color: #ecd9b4;
            font-style: italic;
            font-size: 0.8rem;
        }
        .login-area {
            position: absolute;
            top: 0.8rem;
            right: 1rem;
        }
        .login-btn, .user-info button {
            background: #fff;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .user-info {
            background: #4a3727;
            color: #ffefcf;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .admin-badge {
            background: #d4a017;
            color: #2c1e12;
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.6rem;
        }
        .tab-nav {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            background: #3e2a1f;
            gap: 0.25rem;
            padding: 0.6rem 0.6rem 0 0.6rem;
            scrollbar-width: thin;
        }
        .tab-nav::-webkit-scrollbar { height: 4px; }
        .tab-nav::-webkit-scrollbar-track { background: #5e422b; border-radius: 10px; }
        .tab-nav::-webkit-scrollbar-thumb { background: #f5b042; border-radius: 10px; }
        .tab-btn {
            background: #5e422b;
            border: none;
            padding: 0.5rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #ffefcf;
            cursor: pointer;
            border-radius: 1rem 1rem 0 0;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tab-btn:hover { background: #7b5a3c; }
        .tab-btn.active {
            background: #ffefcf;
            color: #3e2a1f;
            border-bottom: 2px solid #ffb347;
        }
        .tab-content-container {
            background: #ffefcf;
            padding: 1rem;
            min-height: 300px;
            flex: 1;
        }
        .tab-pane { display: none; animation: fadeSlide 0.25s ease-out; }
        .tab-pane.active-pane { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dream-card {
            background: #fffaf2;
            border-radius: 1.5rem;
            padding: 1rem;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
        }
        .dream-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #4b2e1a;
            border-left: 5px solid #f5b042;
            padding-left: 0.7rem;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .dream-title span {
            background: #f0dbc0;
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 30px;
        }
        .dream-description {
            font-size: 0.95rem;
            line-height: 1.5;
            background: #fff6ea;
            padding: 0.8rem;
            border-radius: 1rem;
            white-space: pre-wrap;
            margin-bottom: 1rem;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .voice-btn, .edit-btn, .delete-btn {
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .voice-btn {
            background: linear-gradient(95deg, #2c5f7a, #1e3e58);
            color: white;
        }
        .voice-btn:hover { background: linear-gradient(95deg, #1f4a64, #123247); transform: scale(1.02); }
        .edit-btn { background: #f5b042; color: #2c1e12; }
        .edit-btn:hover { background: #e09d2c; transform: scale(1.02); }
        .delete-btn { background: #aa6f5e; color: white; }
        .delete-btn:hover { background: #8b5342; transform: scale(1.02); }
        .speech-status {
            font-size: 0.65rem;
            color: #7e6b53;
            margin-left: 0.5rem;
        }
        .admin-section {
            background: #f7efdf;
            border-top: 3px solid #d6b575;
            padding: 1rem;
            display: none;
        }
        .admin-section h3 {
            color: #4b2e1a;
            font-size: 1.2rem;
            margin-bottom: 0.6rem;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }
        .form-group {
            margin-bottom: 0.7rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #5a3e28;
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.6rem;
            border-radius: 1rem;
            border: 1px solid #e2caa4;
            background: #fffdf9;
            font-family: inherit;
        }
        .btn-post, .btn-bulk {
            background: #8b6946;
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-bulk { background: #4a6741; }
        .btn-post:hover, .btn-bulk:hover { filter: brightness(1.05); }
        .global-footer {
            background: #2c1e12;
            text-align: center;
            padding: 0.7rem;
            color: #cbae86;
            font-size: 0.7rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fffaf2;
            max-width: 600px;
            width: 90%;
            border-radius: 1.5rem;
            padding: 1.2rem;
        }
        .modal-content textarea {
            width: 100%;
            margin: 0.5rem 0;
            padding: 0.6rem;
            border-radius: 1rem;
            font-family: monospace;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 1rem;
        }
        .import-confirm, .save-edit {
            background: #2c5f7a;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            border: none;
            cursor: pointer;
        }
        .import-cancel, .cancel-edit {
            background: #aa6f5e;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            border: none;
            cursor: pointer;
        }
        .empty-message {
            text-align: center;
            padding: 1.5rem;
            background: #fff6ea;
            border-radius: 1.2rem;
            color: #7a5a3a;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #7a5a3a;
        }
        @media (max-width: 550px) {
            .dream-book { margin: 0.5rem; border-radius: 1.5rem; }
            .global-header h1 { font-size: 1.3rem; }
            .dream-title { font-size: 1.1rem; }
            .voice-btn, .edit-btn, .delete-btn { padding: 0.4rem 0.8rem; font-size: 0.7rem; }
            .tab-btn { padding: 0.4rem 0.7rem; font-size: 0.7rem; }
            .login-area { position: static; text-align: right; margin-top: 0.5rem; }
        }
    </style>
</head>
<body>
<div class="dream-book">
    <div class="global-header">
        <h1>📖 BUKU MIMPI</h1>
        <p>✦ Karangan mimpi-mimpi ✦ Setiap tab adalah dunia tersendiri ✦</p>
        <div class="login-area" id="loginArea"></div>
    </div>

    <div class="tab-nav" id="tabNav"></div>
    <div class="tab-content-container" id="tabContent">
        <div class="loading">Loading mimpi...</div>
    </div>

    <div class="admin-section" id="adminSection">
        <h3>✍️ Kolom Admin – Tambah / Edit / Hapus Mimpi ✍️</h3>
        <div class="button-group">
            <button class="btn-post" id="postDreamBtn">📌 Post Satu Mimpi</button>
            <button class="btn-bulk" id="bulkImportBtn">📦 Import Pukal (JSON)</button>
        </div>
        <div class="form-group">
            <label>🌟 Tajuk Mimpi</label>
            <input type="text" id="newDreamTitle" placeholder="Contoh: Terbang ke Bulan">
        </div>
        <div class="form-group">
            <label>📝 Cerita Mimpi</label>
            <textarea id="newDreamDesc" rows="3" placeholder="Tuliskan detail mimpimu..."></textarea>
        </div>
        <div class="form-group">
            <label>🏷️ Label pendek untuk tab (opsional)</label>
            <input type="text" id="newDreamShort" placeholder="Misal: 'Terbang'" maxlength="14">
        </div>
    </div>

    <div class="global-footer">
        🎙️ Suara AI lelaki | Data disimpan di Supabase | Admin perlu login dengan Google
    </div>
</div>

<!-- MODAL IMPORT -->
<div id="bulkModal" class="modal">
    <div class="modal-content">
        <h3>📦 Import Pukal Mimpi (JSON)</h3>
        <textarea id="bulkJsonData" rows="8" placeholder='[{"title":"Mimpi 1","shortLabel":"M1","description":"Cerita..."}]'></textarea>
        <div class="modal-buttons">
            <button class="import-cancel" id="cancelBulkBtn">Batal</button>
            <button class="import-confirm" id="confirmBulkBtn">Import Sekarang</button>
        </div>
    </div>
</div>

<!-- MODAL EDIT -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3>✏️ Edit Mimpi</h3>
        <label>Tajuk</label><input type="text" id="editTitle" style="width:100%; margin:0.3rem 0; padding:0.5rem;">
        <label>Label pendek</label><input type="text" id="editShortLabel" style="width:100%; margin:0.3rem 0; padding:0.5rem;">
        <label>Cerita</label><textarea id="editDescription" rows="5" style="width:100%; margin:0.3rem 0; padding:0.5rem;"></textarea>
        <div class="modal-buttons">
            <button class="cancel-edit" id="cancelEditBtn">Batal</button>
            <button class="save-edit" id="saveEditBtn">Simpan</button>
        </div>
    </div>
</div>

<script>
    // =========== KONFIGURASI SUPABASE (SUDAH DIMASUKKAN) ===========
    const SUPABASE_URL = "https://ofatbleambihhqbboalh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mYXRibGVhbWJpaGhxYmJvYWxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MzgxMzQsImV4cCI6MjA5NjMxNDEzNH0.FOGqpRUa9Ch0Z7Ilk-yoCkKxs1zrKix_2DxdnTz6OXA";
    
    // ⚠️ PENTING: Gantikan email di bawah dengan email Google ANDA
    const ADMIN_EMAIL = "ADMIN_EMAIL_HERE";  // <--- UBAH INI
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let dreamsData = [];
    let currentActiveId = null;
    let currentUser = null;
    let isAdmin = false;
    let preferredVoice = null;
    let voicesLoaded = false;

    // =========== SUARA AI LELAKI ===========
    function initVoiceSelection() {
        const voices = window.speechSynthesis.getVoices();
        if (!voices.length) return;
        let maleVoice = voices.find(v => 
            v.name.toLowerCase().includes('male') || 
            (v.lang === 'en-US' && v.name.toLowerCase().includes('male')) ||
            v.name.toLowerCase().includes('google uk english male')
        );
        if (!maleVoice) maleVoice = voices.find(v => !v.name.toLowerCase().includes('female'));
        preferredVoice = maleVoice || voices[0];
        voicesLoaded = true;
    }

    function speakDream(text, dreamId) {
        if (!window.speechSynthesis) return alert("Pelayar tidak menyokong speech.");
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        if (preferredVoice) utterance.voice = preferredVoice;
        else if (!voicesLoaded) {
            window.speechSynthesis.onvoiceschanged = () => {
                initVoiceSelection();
                if (preferredVoice) utterance.voice = preferredVoice;
                window.speechSynthesis.speak(utterance);
            };
            return;
        }
        utterance.onstart = () => {
            const span = document.getElementById(`speechStatus-${dreamId}`);
            if (span) span.innerText = "🔊 AI membaca...";
        };
        utterance.onend = () => {
            const span = document.getElementById(`speechStatus-${dreamId}`);
            if (span) { 
                span.innerText = "✅ Selesai"; 
                setTimeout(() => { 
                    if(span.innerText === "✅ Selesai") span.innerText = "✨ AI siap"; 
                }, 2000); 
            }
        };
        utterance.onerror = () => {
            const span = document.getElementById(`speechStatus-${dreamId}`);
            if (span) span.innerText = "⚠️ Gagal";
        };
        window.speechSynthesis.speak(utterance);
    }

    // =========== RENDER BUKU MIMPI ===========
    function renderDreamBook() {
        const tabNav = document.getElementById('tabNav');
        const tabContent = document.getElementById('tabContent');
        if (!tabNav || !tabContent) return;

        const activePane = document.querySelector('.tab-pane.active-pane');
        if (activePane) currentActiveId = activePane.getAttribute('data-pane');
        else if (dreamsData.length > 0 && !currentActiveId) currentActiveId = dreamsData[0].id;

        tabNav.innerHTML = '';
        tabContent.innerHTML = '';

        if (dreamsData.length === 0) {
            tabContent.innerHTML = `<div class="empty-message">✨ Belum ada mimpi. Admin boleh menambah mimpi pertama. ✨</div>`;
            return;
        }

        dreamsData.forEach((dream, idx) => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            if (currentActiveId === dream.id) btn.classList.add('active');
            btn.setAttribute('data-tab', dream.id);
            const label = (dream.short_label && dream.short_label.trim()) ? dream.short_label : dream.title.substring(0, 12);
            btn.innerHTML = `<span>${escapeHtml(label)}</span>`;
            btn.addEventListener('click', () => activateTab(dream.id));
            tabNav.appendChild(btn);

            const pane = document.createElement('div');
            pane.className = 'tab-pane';
            if (currentActiveId === dream.id) pane.classList.add('active-pane');
            pane.setAttribute('data-pane', dream.id);
            const adminButtons = isAdmin ? `
                <button class="edit-btn" data-edit-id="${dream.id}">✏️ Edit</button>
                <button class="delete-btn" data-delete-id="${dream.id}">🗑️ Hapus</button>
            ` : '';
            pane.innerHTML = `
                <div class="dream-card">
                    <div class="dream-title">
                        ${escapeHtml(dream.title)}
                        <span>📖 mimpi #${idx+1}</span>
                    </div>
                    <div class="dream-description">${escapeHtml(dream.description)}</div>
                    <div class="action-buttons">
                        <button class="voice-btn" data-read-id="${dream.id}">🎙️ Baca dengan AI</button>
                        ${adminButtons}
                        <span class="speech-status" id="speechStatus-${dream.id}">✨ AI siap</span>
                    </div>
                </div>
            `;
            tabContent.appendChild(pane);
        });

        document.querySelectorAll('.voice-btn').forEach(btn => {
            btn.removeEventListener('click', voiceHandler);
            btn.addEventListener('click', voiceHandler);
        });
        function voiceHandler(e) {
            const id = e.currentTarget.getAttribute('data-read-id');
            const dream = dreamsData.find(d => d.id === id);
            if (dream) speakDream(dream.description, id);
        }
        
        if (isAdmin) {
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.removeEventListener('click', editHandler);
                btn.addEventListener('click', editHandler);
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.removeEventListener('click', deleteHandler);
                btn.addEventListener('click', deleteHandler);
            });
        }
    }

    function activateTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.getAttribute('data-tab') === tabId) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        document.querySelectorAll('.tab-pane').forEach(pane => {
            if (pane.getAttribute('data-pane') === tabId) pane.classList.add('active-pane');
            else pane.classList.remove('active-pane');
        });
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        currentActiveId = tabId;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    // =========== FUNGSI LOAD DATA DARI SUPABASE ===========
    async function loadDreams() {
        const tabContent = document.getElementById('tabContent');
        if (tabContent) tabContent.innerHTML = '<div class="loading">Loading mimpi...</div>';
        
        const { data, error } = await supabase
            .from('dreams')
            .select('*')
            .order('created_at', { ascending: true });
        
        if (error) {
            console.error("Error loading dreams:", error);
            if (tabContent) tabContent.innerHTML = `<div class="empty-message">⚠️ Gagal memuat mimpi: ${error.message}</div>`;
            return;
        }
        
        dreamsData = data || [];
        renderDreamBook();
        if (dreamsData.length > 0 && !currentActiveId) activateTab(dreamsData[0].id);
    }

    // =========== CRUD OPERATIONS ===========
    async function addDream(title, desc, shortLabel) {
        if (!title.trim() || !desc.trim()) throw new Error("Tajuk dan cerita wajib");
        const newId = Date.now().toString() + "_" + Math.random().toString(36).substr(2, 6);
        const { error } = await supabase.from('dreams').insert([{
            id: newId,
            title: title.trim(),
            short_label: shortLabel.trim() || title.trim().substring(0, 12),
            description: desc.trim()
        }]);
        if (error) throw new Error(error.message);
        await loadDreams();
        activateTab(newId);
    }

    async function updateDream(id, title, shortLabel, desc) {
        const { error } = await supabase
            .from('dreams')
            .update({ title, short_label: shortLabel, description: desc })
            .eq('id', id);
        if (error) throw new Error(error.message);
        await loadDreams();
        activateTab(id);
    }

    async function deleteDream(id) {
        const { error } = await supabase.from('dreams').delete().eq('id', id);
        if (error) throw new Error(error.message);
        await loadDreams();
        if (dreamsData.length > 0) activateTab(dreamsData[0].id);
    }

    async function bulkImport(dreamsArray) {
        if (!Array.isArray(dreamsArray) || dreamsArray.length === 0) throw new Error("Array kosong");
        const newDreams = [];
        for (let item of dreamsArray) {
            if (item.title && item.description) {
                newDreams.push({
                    id: Date.now().toString() + "_" + Math.random().toString(36).substr(2, 6) + "_" + newDreams.length,
                    title: item.title.trim(),
                    short_label: (item.shortLabel?.trim()) || item.title.trim().substring(0, 12),
                    description: item.description.trim()
                });
            }
        }
        if (newDreams.length === 0) throw new Error("Tiada data sah");
        const { error } = await supabase.from('dreams').insert(newDreams);
        if (error) throw new Error(error.message);
        await loadDreams();
        return newDreams.length;
    }

    // =========== HANDLER ADMIN ===========
    let editingId = null;
    const editModal = document.getElementById('editModal');
    
    function editHandler(e) {
        const id = e.currentTarget.getAttribute('data-edit-id');
        const dream = dreamsData.find(d => d.id === id);
        if (!dream) return;
        editingId = id;
        document.getElementById('editTitle').value = dream.title;
        document.getElementById('editShortLabel').value = dream.short_label || '';
        document.getElementById('editDescription').value = dream.description;
        editModal.style.display = 'flex';
    }
    
    async function saveEdit() {
        if (!editingId) return;
        const newTitle = document.getElementById('editTitle').value.trim();
        const newShort = document.getElementById('editShortLabel').value.trim();
        const newDesc = document.getElementById('editDescription').value.trim();
        if (!newTitle || !newDesc) { alert("Tajuk dan cerita wajib!"); return; }
        try {
            await updateDream(editingId, newTitle, newShort || newTitle.substring(0,12), newDesc);
            editModal.style.display = 'none';
            editingId = null;
        } catch(e) { alert(e.message); }
    }
    
    async function deleteHandler(e) {
        const id = e.currentTarget.getAttribute('data-delete-id');
        if (confirm("Padam mimpi ini untuk semua pengguna?")) {
            try {
                await deleteDream(id);
            } catch(e) { alert(e.message); }
        }
    }

    // =========== SUPABASE AUTH ===========
    async function checkAndUpdateAuth() {
        const { data: { user } } = await supabase.auth.getUser();
        currentUser = user;
        const loginArea = document.getElementById('loginArea');
        
        if (user) {
            isAdmin = user.email === ADMIN_EMAIL;
            loginArea.innerHTML = `
                <div class="user-info">
                    👤 ${user.email} ${isAdmin ? '<span class="admin-badge">Admin</span>' : ''}
                    <button id="logoutBtn">Logout</button>
                </div>
            `;
            document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                await supabase.auth.signOut();
                location.reload();
            });
        } else {
            isAdmin = false;
            loginArea.innerHTML = `
                <button class="login-btn" id="loginBtn">🔑 Login dengan Google</button>
            `;
            document.getElementById('loginBtn')?.addEventListener('click', async () => {
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin + window.location.pathname }
                });
                if (error) alert("Login gagal: " + error.message);
            });
        }
        
        const adminSection = document.getElementById('adminSection');
        if (adminSection) adminSection.style.display = isAdmin ? 'block' : 'none';
        renderDreamBook();
    }

    // Subscribe ke realtime Supabase
    function subscribeToRealtime() {
        const channel = supabase
            .channel('dreams-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'dreams' }, () => {
                loadDreams();
            })
            .subscribe();
    }

    // =========== INISIALISASI ===========
    window.addEventListener('load', async () => {
        // Suara
        if (window.speechSynthesis) {
            if (window.speechSynthesis.getVoices().length) initVoiceSelection();
            else window.speechSynthesis.onvoiceschanged = initVoiceSelection;
        }
        
        // Auth dan data
        await checkAndUpdateAuth();
        await loadDreams();
        subscribeToRealtime();
        
        // Admin form events
        document.getElementById('postDreamBtn')?.addEventListener('click', async () => {
            if (!isAdmin) return;
            const title = document.getElementById('newDreamTitle').value;
            const desc = document.getElementById('newDreamDesc').value;
            const short = document.getElementById('newDreamShort').value;
            try {
                await addDream(title, desc, short);
                document.getElementById('newDreamTitle').value = '';
                document.getElementById('newDreamDesc').value = '';
                document.getElementById('newDreamShort').value = '';
                alert("Mimpi berjaya ditambah!");
            } catch(e) { alert(e.message); }
        });
        
        document.getElementById('bulkImportBtn')?.addEventListener('click', () => {
            if (isAdmin) document.getElementById('bulkModal').style.display = 'flex';
        });
        
        document.getElementById('confirmBulkBtn')?.addEventListener('click', async () => {
            const jsonText = document.getElementById('bulkJsonData').value.trim();
            if (!jsonText) return alert("Masukkan JSON");
            try {
                const parsed = JSON.parse(jsonText);
                const count = await bulkImport(parsed);
                document.getElementById('bulkJsonData').value = '';
                document.getElementById('bulkModal').style.display = 'none';
                alert(`Berjaya import ${count} mimpi.`);
            } catch(e) { alert("JSON tidak sah atau gagal import: " + e.message); }
        });
        
        document.getElementById('cancelBulkBtn')?.addEventListener('click', () => {
            document.getElementById('bulkModal').style.display = 'none';
        });
        
        document.getElementById('cancelEditBtn')?.addEventListener('click', () => {
            editModal.style.display = 'none';
        });
        
        document.getElementById('saveEditBtn')?.addEventListener('click', saveEdit);
        
        window.addEventListener('click', (e) => {
            if (e.target === editModal) editModal.style.display = 'none';
            if (e.target === document.getElementById('bulkModal')) document.getElementById('bulkModal').style.display = 'none';
        });
    });
</script>
</body>
</html>
