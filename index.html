<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Buku Mimpi - Koleksi Mimpi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- BUTANG HAMBURGER (MOBILE) -->
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <div class="overlay" id="overlay"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>📖 BUKU MIMPI</h2>
            <p>Karangan mimpi-mimpi</p>
        </div>
        <div class="sidebar-menu">
            <div class="menu-item active" id="homeLink">
                <i>🏠</i> <span>Home</span>
            </div>
            <div class="menu-item" id="loginLogoutLink">
                <i>🔑</i> <span id="loginLogoutText">Login</span>
            </div>
            <div class="menu-item" id="favoriteLink">
                <i>⭐</i> <span>Favorit Saya</span>
            </div>
        </div>
        <div class="sidebar-footer">
            <p>✦ Setiap mimpi ada kisahnya ✦</p>
        </div>
    </div>

    <!-- KANDUNGAN UTAMA -->
    <div class="main-content">
        <div class="dream-container">
            <div class="dream-card" id="dreamCard">
                <div class="counter" id="counter">Memuatkan...</div>
                <div class="dream-title" id="dreamTitle">-</div>
                <div class="dream-description" id="dreamDescription">-</div>
                <div class="button-group">
                    <button class="btn" id="randomBtn">🎲 Mimpi Lain</button>
                    <button class="btn voice-btn" id="voiceBtn">🎙️ Dengar</button>
                    <button class="btn favorite-btn" id="favoriteBtn">⭐ Simpan Favorit</button>
                </div>
                <div class="speech-status" id="speechStatus">✨ AI siap membaca</div>
            </div>
        </div>

        <!-- SENARAI SEMUA MIMPI -->
        <div class="dream-list-section">
            <h3>
                📜 Senarai Semua Mimpi
                <input type="text" id="searchInput" class="search-box" placeholder="Cari mimpi...">
            </h3>
            <div class="dream-list" id="dreamList">
                <div class="empty-message">Loading mimpi...</div>
            </div>
        </div>
        
        <div class="footer">
            🎙️ Suara AI lelaki | Koleksi ratusan mimpi
        </div>
    </div>

    <!-- MODAL FAVORIT -->
    <div id="favoriteModal" class="modal">
        <div class="modal-content">
            <h3>⭐ Favorit Saya</h3>
            <div id="favoriteList"></div>
            <div class="modal-buttons">
                <button class="btn" id="closeFavoriteModal">Tutup</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let dreamsData = [];
        let currentDream = null;
        let searchTerm = '';
        
        // =========== FUNGSI SIDEBAR ===========
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }
        
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('overlay').classList.add('active');
        }
        
        document.getElementById('hamburgerBtn').onclick = openSidebar;
        document.getElementById('overlay').onclick = closeSidebar;
        
        // =========== UPDATE SIDEBAR STATE ===========
        function updateSidebar() {
            const isLoggedIn = localStorage.getItem(SESSION_KEY) === "logged_in";
            const loginLogoutText = document.getElementById('loginLogoutText');
            const loginLogoutLink = document.getElementById('loginLogoutLink');
            
            if (isLoggedIn) {
                loginLogoutText.innerHTML = 'Logout';
                loginLogoutLink.onclick = () => {
                    localStorage.removeItem(SESSION_KEY);
                    localStorage.removeItem("buku_mimpi_current_user");
                    closeSidebar();
                    window.location.href = "index.html";
                };
                const currentUser = localStorage.getItem("buku_mimpi_current_user");
                if (currentUser === 'admin') {
                    if (!document.getElementById('adminLink')) {
                        const adminLink = document.createElement('div');
                        adminLink.id = 'adminLink';
                        adminLink.className = 'menu-item';
                        adminLink.innerHTML = '<i>👑</i> <span>Panel Admin</span>';
                        adminLink.onclick = () => {
                            closeSidebar();
                            window.location.href = 'dashboard.html';
                        };
                        document.querySelector('.sidebar-menu').appendChild(adminLink);
                    }
                }
            } else {
                loginLogoutText.innerHTML = 'Login';
                loginLogoutLink.onclick = () => {
                    closeSidebar();
                    window.location.href = 'login.html';
                };
                const adminLink = document.getElementById('adminLink');
                if (adminLink) adminLink.remove();
            }
        }
        
        // =========== PAPAR MIMPI ===========
        function displayDream(dream) {
            if (!dream) return;
            currentDream = dream;
            document.getElementById('dreamTitle').innerHTML = escapeHtml(dream.title);
            document.getElementById('dreamDescription').innerHTML = escapeHtml(dream.description);
            document.getElementById('counter').innerHTML = `📖 ${dream.title}`;
            document.getElementById('speechStatus').innerHTML = "✨ AI siap membaca";
            
            const favBtn = document.getElementById('favoriteBtn');
            if (isFavorite(dream.id)) {
                favBtn.innerHTML = '⭐ Sudah Favorit';
                favBtn.classList.add('saved');
            } else {
                favBtn.innerHTML = '⭐ Simpan Favorit';
                favBtn.classList.remove('saved');
            }
            
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function showRandomDream() {
            if (dreamsData.length === 0) {
                document.getElementById('dreamTitle').innerHTML = "✨ Belum Ada Mimpi ✨";
                document.getElementById('dreamDescription').innerHTML = "Sila tunggu admin menambah mimpi.";
                document.getElementById('counter').innerHTML = "0 mimpi dalam koleksi";
                return;
            }
            const randomIndex = Math.floor(Math.random() * dreamsData.length);
            displayDream(dreamsData[randomIndex]);
        }
        
        // =========== SENARAI SEMUA MIMPI ===========
        function renderDreamList() {
            const dreamListDiv = document.getElementById('dreamList');
            let filteredDreams = dreamsData;
            
            if (searchTerm) {
                filteredDreams = dreamsData.filter(d => 
                    d.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    (d.shortLabel && d.shortLabel.toLowerCase().includes(searchTerm.toLowerCase()))
                );
            }
            
            if (filteredDreams.length === 0) {
                dreamListDiv.innerHTML = '<div class="empty-message">✨ Tiada mimpi ditemui ✨</div>';
                return;
            }
            
            dreamListDiv.innerHTML = '';
            filteredDreams.forEach((dream, idx) => {
                const item = document.createElement('div');
                item.className = 'dream-list-item';
                item.innerHTML = `
                    <div class="dream-list-title">${escapeHtml(dream.title)}</div>
                    <div class="dream-list-date">${dream.shortLabel ? `🏷️ ${escapeHtml(dream.shortLabel)}` : `#${idx+1}`}</div>
                `;
                item.onclick = () => {
                    displayDream(dream);
                    if (window.innerWidth <= 768) closeSidebar();
                };
                dreamListDiv.appendChild(item);
            });
        }
        
        // =========== CARIAN ===========
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderDreamList();
        });
        
        // =========== FAVORIT ===========
        function showFavorites() {
            const favorites = getFavorites();
            const favoriteDreams = dreamsData.filter(d => favorites.includes(d.id));
            const favoriteListDiv = document.getElementById('favoriteList');
            
            if (favoriteDreams.length === 0) {
                favoriteListDiv.innerHTML = '<div class="empty-message">✨ Belum ada mimpi favorit ✨</div>';
            } else {
                favoriteListDiv.innerHTML = '';
                favoriteDreams.forEach(dream => {
                    const item = document.createElement('div');
                    item.className = 'favorite-item';
                    item.innerHTML = `
                        <span>${escapeHtml(dream.title)}</span>
                        <button class="remove-fav" data-id="${dream.id}">Hapus</button>
                    `;
                    favoriteListDiv.appendChild(item);
                });
                
                document.querySelectorAll('.remove-fav').forEach(btn => {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        removeFavorite(btn.getAttribute('data-id'));
                        showFavorites();
                        if (currentDream && currentDream.id === btn.getAttribute('data-id')) {
                            const favBtn = document.getElementById('favoriteBtn');
                            favBtn.innerHTML = '⭐ Simpan Favorit';
                            favBtn.classList.remove('saved');
                        }
                    };
                });
            }
            document.getElementById('favoriteModal').style.display = 'flex';
        }
        
        // =========== LOAD DATA ===========
        function loadAllData() {
            dreamsData = loadDreams();
            renderDreamList();
            if (dreamsData.length > 0) {
                displayDream(dreamsData[0]);
            } else {
                document.getElementById('dreamTitle').innerHTML = "✨ Belum Ada Mimpi ✨";
                document.getElementById('dreamDescription').innerHTML = "Sila tunggu admin menambah mimpi.";
                document.getElementById('counter').innerHTML = "0 mimpi dalam koleksi";
            }
        }
        
        // =========== INIT ===========
        window.addEventListener('load', () => {
            loadAllData();
            updateSidebar();
            
            if (window.speechSynthesis) {
                if (window.speechSynthesis.getVoices().length) initVoice();
                else window.speechSynthesis.onvoiceschanged = initVoice;
            }
            
            document.getElementById('randomBtn').onclick = showRandomDream;
            document.getElementById('voiceBtn').onclick = () => {
                if (currentDream && currentDream.description) {
                    speakText(currentDream.description, 'speechStatus');
                }
            };
            document.getElementById('favoriteBtn').onclick = () => {
                if (!currentDream) return;
                if (isFavorite(currentDream.id)) {
                    removeFavorite(currentDream.id);
                    document.getElementById('favoriteBtn').innerHTML = '⭐ Simpan Favorit';
                    document.getElementById('favoriteBtn').classList.remove('saved');
                } else {
                    addFavorite(currentDream.id);
                    document.getElementById('favoriteBtn').innerHTML = '⭐ Sudah Favorit';
                    document.getElementById('favoriteBtn').classList.add('saved');
                }
            };
            document.getElementById('favoriteLink').onclick = () => {
                showFavorites();
                if (window.innerWidth <= 768) closeSidebar();
            };
            document.getElementById('closeFavoriteModal').onclick = () => {
                document.getElementById('favoriteModal').style.display = 'none';
            };
            document.getElementById('homeLink').onclick = () => {
                showRandomDream();
                if (window.innerWidth <= 768) closeSidebar();
            };
            window.onclick = (e) => {
                if (e.target === document.getElementById('favoriteModal')) {
                    document.getElementById('favoriteModal').style.display = 'none';
                }
            };
        });
    </script>
</body>
</html>
